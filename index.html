<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI AI | Corely AI Sovereign Intelligence v3.3 Live Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .glow-effect { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); }
        .cyber-border { border: 1px solid rgba(59, 130, 246, 0.3); }
        .bg-grid { background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px); background-size: 24px 24px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 3px; }
        .code-box { background: #0b0f19; border: 1px solid #1e3a8a; font-family: monospace; direction: ltr; text-align: left; }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col justify-between">

    <!-- شاشة تسجيل الدخول السيادية -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-gray-900 cyber-border p-8 rounded-2xl w-full max-w-md glow-effect">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-black text-blue-500 tracking-wider">CORELY AI</h1>
                <p class="text-xs text-gray-400 mt-1">بوابة الدخول إلى النظام السيادي v3.3 المتصل</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">اسم المستخدم السيادي</label>
                    <input type="text" id="username-input" required class="w-full bg-gray-950 cyber-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="أدخل اسمك...">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">مفتاح المصادقة السيادي</label>
                    <input type="password" value="app-sECdyceP1zizS7oBvmPOtzhl" disabled class="w-full bg-gray-950 cyber-border rounded-lg px-4 py-3 text-gray-500 text-xs focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition glow-effect mt-2">
                    تفعيل الجلسة العظمى الحية
                </button>
            </form>
        </div>
    </div>

    <!-- الهيدر السيادي -->
    <header class="bg-gray-950/90 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
            <span class="font-black text-lg text-blue-400 tracking-wider">Corely AI</span>
            <span class="text-xs bg-emerald-950 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-800">v3.3 Live Web Bridge</span>
        </div>
        <div class="flex items-center space-x-3 space-x-reverse">
            <button onclick="toggleSidebar()" class="bg-gray-900 hover:bg-gray-800 text-blue-400 border border-blue-900 px-3 py-1.5 rounded-lg text-xs transition">📁 السجل</button>
            <div id="user-badge" class="text-xs text-gray-300 bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-800">غير مسجل</div>
        </div>
    </header>

    <!-- الهيكل الرئيسي مع السايدبار -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- السايدبار الجانبي لإدارة الجلسات -->
        <aside id="sidebar" class="w-72 bg-gray-950/95 border-l border-gray-800 flex flex-col justify-between transition-all duration-300 z-20 absolute md:relative h-full right-0 translate-x-0">
            <div class="p-4 border-b border-gray-900">
                <button onclick="createNewChat()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center space-x-2 space-x-reverse glow-effect">
                    <span>+ محادثة سيادية جديدة</span>
                </button>
            </div>
            
            <div id="sessions-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- الجلسات -->
            </div>

            <div class="p-4 border-t border-gray-900 text-center">
                <button onclick="clearAllSessions()" class="text-xs text-red-400 hover:text-red-300 transition">حذف كافة السجلات</button>
            </div>
        </aside>

        <!-- منطقة المحادثة الأساسية -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between">
            <div id="chat-container" class="space-y-4 overflow-y-auto max-h-[60vh] p-4">
                <div class="flex items-start space-x-3 space-x-reverse">
                    <div class="bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                    <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                        النظام السيادي v3.3 متصل الآن بالشبكة ومستعد لتنفيذ المهام وجلب البيانات الحية. أطلق أمرك!
                    </div>
                </div>
            </div>

            <!-- إدخال الأوامر مع أدوات مساعدة -->
            <div class="mt-4 bg-gray-900 cyber-border rounded-2xl p-2 flex items-center glow-effect">
                <input type="text" id="user-input" class="flex-1 bg-transparent px-4 py-2 text-white focus:outline-none text-sm" placeholder="أدخل أمرك السيادي أو اطلب بحثاً حياً..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold transition text-sm shadow-lg">
                    إرسال تنفيذي
                </button>
            </div>
        </main>
    </div>

    <!-- الفوتر -->
    <footer class="text-center py-3 text-xs text-gray-500 border-t border-gray-900 z-10">
        Engineered & Commanded by Corely AI • Sovereign Intelligence Architecture v3.3
    </footer>

    <script>
        let currentUserId = "amr-sovereign-user";
        let sessions = JSON.parse(localStorage.getItem('ami_sessions_v33')) || [{ id: '1', title: 'محادثة جديدة', messages: [] }];
        let currentSessionId = sessions[0].id;

        window.onload = function() {
            renderSessionsList();
            loadCurrentSession();
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username-input').value;
            if(username) {
                currentUserId = username;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('user-badge').innerText = `المستخدم: ${username}`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        function createNewChat() {
            const newSession = {
                id: Date.now().toString(),
                title: 'محادثة جديدة',
                messages: []
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveAndRefresh();
        }

        function switchSession(id) {
            currentSessionId = id;
            loadCurrentSession();
        }

        function loadCurrentSession() {
            const currentSession = sessions.find(s => s.id === currentSessionId) || sessions[0];
            const container = document.getElementById('chat-container');
            
            let html = `
                <div class="flex items-start space-x-3 space-x-reverse">
                    <div class="bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                    <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                        النظام السيادي v3.3 متصل الآن بالشبكة ومستعد لتنفيذ المهام وجلب البيانات الحية. أطلق أمرك!
                    </div>
                </div>
            `;

            currentSession.messages.forEach(msg => {
                if(msg.role === 'user') {
                    html += `
                        <div class="flex items-start justify-end space-x-3 space-x-reverse">
                            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-xl text-sm text-gray-200">${escapeHtml(msg.content)}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex items-start space-x-3 space-x-reverse">
                            <div class="bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                            <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200 leading-relaxed">${formatResponse(msg.content)}</div>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
            renderSessionsList();
        }

        function renderSessionsList() {
            const listContainer = document.getElementById('sessions-list');
            let html = '';
            sessions.forEach(s => {
                const activeClass = s.id === currentSessionId ? 'bg-blue-950/80 border-blue-600 text-blue-300' : 'bg-gray-900/50 border-gray-800 text-gray-400 hover:bg-gray-900';
                html += `
                    <div onclick="switchSession('${s.id}')" class="p-3 rounded-xl border ${activeClass} cursor-pointer text-xs truncate transition flex justify-between items-center group">
                        <span class="truncate">${escapeHtml(s.title)}</span>
                        <button onclick="event.stopPropagation(); deleteSession('${s.id}')" class="text-gray-600 group-hover:text-red-400 p-1">×</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function deleteSession(id) {
            if(sessions.length <= 1) {
                alert('لا يمكن حذف الجلسة الأخيرة!');
                return;
            }
            sessions = sessions.filter(s => s.id !== id);
            if(currentSessionId === id) {
                currentSessionId = sessions[0].id;
            }
            saveAndRefresh();
        }

        function clearAllSessions() {
            if(confirm('هل أنت متأكد من حذف كافة السجلات؟')) {
                sessions = [{ id: Date.now().toString(), title: 'محادثة جديدة', messages: [] }];
                currentSessionId = sessions[0].id;
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('ami_sessions_v33', JSON.stringify(sessions));
            loadCurrentSession();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const userText = input.value.trim();
            if(!userText) return;

            let currentSession = sessions.find(s => s.id === currentSessionId);
            if(currentSession.messages.length === 0) {
                currentSession.title = userText.length > 20 ? userText.substring(0, 20) + '...' : userText;
            }

            currentSession.messages.push({ role: 'user', content: userText });
            saveAndRefresh();

            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3 space-x-reverse">
                    <div class="bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                    <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-400 animate-pulse">
                        جاري معالجة الأمر واستدعاء أدوات الويب الحية عبر النواة السيادية...
                    </div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('https://api.dify.ai/v1/chat-messages', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer app-sECdyceP1zizS7oBvmPOtzhl',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: userText,
                        response_mode: "blocking",
                        user: currentUserId
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                const aiReply = data.answer || "عذراً، استجابة غير متوقعة من النواة السيادية.";

                currentSession.messages.push({ role: 'assistant', content: aiReply });
                saveAndRefresh();

            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `
                    <div class="flex items-start space-x-3 space-x-reverse">
                        <div class="bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0">ERR</div>
                        <div class="bg-gray-900 border border-red-800 p-4 rounded-2xl max-w-xl text-sm text-red-300">
                            فشل الاتصال بالشبكة السيادية الخارجية.
                        </div>
                    </div>
                `;
            }
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatResponse(text) {
            let formatted = escapeHtml(text);
            
            formatted = formatted.replace(/```([\s\S]*?)```/g, function(match, codeContent) {
                const uniqueId = 'code-' + Math.random().toString(36).substr(2, 9);
                return `
                    <div class="my-3 rounded-xl overflow-hidden cyber-border">
                        <div class="bg-gray-950 px-4 py-1.5 flex justify-between items-center text-xs text-gray-400 border-b border-gray-800">
                            <span>منطقة الكود السيادي</span>
                            <button onclick="copyCode('${uniqueId}')" class="bg-blue-600/30 hover:bg-blue-600 text-blue-300 hover:text-white px-2.5 py-1 rounded transition text-xs">نسخ الكود</button>
                        </div>
                        <pre id="${uniqueId}" class="code-box p-4 text-xs text-blue-200 overflow-x-auto"><code>${codeContent.trim()}</code></pre>
                    </div>
                `;
            });

            return formatted.replace(/\n/g, '<br>');
        }

        function copyCode(elementId) {
            const codeElement = document.getElementById(elementId);
            const textToCopy = codeElement.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('تم نسخ الكود بنجاح إلى الحافظة!');
            }).catch(err => {
                console.error('فشل النسخ', err);
            });
        }
    </script>
</body>
</html>
