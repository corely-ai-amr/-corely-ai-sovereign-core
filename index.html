<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI AI | Corely AI Sovereign Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .glow-effect { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); }
        .cyber-border { border: 1px solid rgba(59, 130, 246, 0.3); }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.5; } }
        .bg-grid { background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px); background-size: 24px 24px; }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col justify-between">

    <!-- شاشة تسجيل الدخول السيادية -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-gray-900 cyber-border p-8 rounded-2xl w-full max-w-md glow-effect">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-black text-blue-500 tracking-wider">CORELY AI</h1>
                <p class="text-xs text-gray-400 mt-1">بوابة الدخول إلى النظام السيادي النشط</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">اسم المستخدم السيادي</label>
                    <input type="text" id="username" required class="w-full bg-gray-950 cyber-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="أدخل اسمك...">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">مفتاح المصادقة أو المرور</label>
                    <input type="password" id="password" required class="w-full bg-gray-950 cyber-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition glow-effect mt-2">
                    تفعيل الجلسة والخول
                </button>
            </form>
        </div>
    </div>

    <!-- الهيدر السيادي -->
    <header class="bg-gray-950/80 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></div>
            <span class="font-black text-lg text-blue-400 tracking-wider">Corely AI</span>
            <span class="text-xs bg-blue-950 text-blue-300 px-2 py-0.5 rounded-full border border-blue-800">AMI AI v2.0</span>
        </div>
        <div id="user-badge" class="text-xs text-gray-400 bg-gray-900 px-3 py-1 rounded-lg border border-gray-800">
            غير مسجل
        </div>
    </header>

    <!-- منطقة المحادثة الأسطورية -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between">
        <div id="chat-container" class="space-y-4 overflow-y-auto max-h-[60vh] p-4">
            <div class="flex items-start space-x-3 space-x-reverse">
                <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                    أهلاً بك يا فنان في النظام السيادي الخارق. تم تأمين الجلسة بنجاح، كيف يمكنني مساعدتك في الارتقاء بمشروعك اليوم؟
                </div>
            </div>
        </div>

        <!-- إدخال الأوامر -->
        <div class="mt-4 bg-gray-900 cyber-border rounded-2xl p-2 flex items-center glow-effect">
            <input type="text" id="user-input" class="flex-1 bg-transparent px-4 py-2 text-white focus:outline-none text-sm" placeholder="أدخل أمرك السيادي هنا...">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl font-bold transition text-sm">
                إرسال
            </button>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="text-center py-4 text-xs text-gray-500 border-t border-gray-900">
        Engineered & Commanded by Corely AI • All Rights Reserved
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            if(username) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('user-badge').innerText = `المستخدم: ${username}`;
            }
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            if(!input.value.trim()) return;

            // رسالة المستخدم
            container.innerHTML += `
                <div class="flex items-start justify-end space-x-3 space-x-reverse">
                    <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                        ${input.value}
                    </div>
                </div>
            `;
            
            const userText = input.value;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // محاكاة رد الذكاء الاصطناعي السيادي الفخم
            setTimeout(() => {
                container.innerHTML += `
                    <div class="flex items-start space-x-3 space-x-reverse">
                        <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                        <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                            جاري معالجة أمرك السيادي بدقة فائقة: "${userText}"... النظام يعمل بكفاءة تامة لجعل مشروعك ينافس عالمياً!
                        </div>
                    </div>
                `;
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
