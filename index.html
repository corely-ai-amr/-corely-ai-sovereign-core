<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI AI | Corely AI Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glow { text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header / Branding -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 p-4 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-black tracking-wider glow text-blue-400">Corely AI <span class="text-xs text-slate-400 font-normal">| AMI AI v1.0</span></h1>
        </div>
        <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
            النظام السيادي النشط ⚡
        </div>
    </header>

    <!-- Chat Messages Area -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 chat-container">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">AMI</div>
            <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-4 max-w-2xl text-slate-200 leading-relaxed shadow-xl">
                أهلاً بك يا عمرو. أنا <strong>AMI AI</strong>، البنية التحتية الخارقة المملوكة لـ <strong>Corely AI</strong>. النظام جاهز بالكامل لتنفيذ المهام، استخراج البيانات، وكتابة الأكواد بروح سيادية تامة. كيف نبدأ العمل اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Form Area -->
    <footer class="bg-slate-900/90 border-t border-slate-800 p-4">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <textarea id="userInput" rows="1" placeholder="أدخل أمرك السيادي هنا..." class="flex-1 bg-slate-950 border border-slate-700/70 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none max-h-32"></textarea>
            <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 flex items-center justify-center">
                إرسال
            </button>
        </div>
        <div class="text-center mt-2 text-[10px] text-slate-500">
            Engineered & Commanded by Corely AI &bull; All Rights Reserved
        </div>
    </footer>

    <!-- JavaScript Logic for API Integration -->
    <script>
        // إعدادات الاتصال المدمجة خصيصاً لمنصة Corely AI
        const API_URL = "https://api.dify.ai/v1/chat-messages";
        const API_KEY = "app-sECdyceP1zizS7oBvmPOtzhl";

        let conversationId = "";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const message = inputField.value.trim();

            if (!message) return;

            // إظهار رسالة المستخدم
            chatContainer.innerHTML += `
                <div class="flex items-start justify-end space-x-3 space-x-reverse">
                    <div class="bg-blue-600/20 border border-blue-500/40 rounded-2xl p-4 max-w-2xl text-slate-100 leading-relaxed shadow-lg">
                        ${escapeHtml(message)}
                    </div>
                </div>`;
            
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // رسالة التحميل المؤقتة
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg animate-pulse">AMI</div>
                    <div class="bg-slate-800/50 border border-slate-700/40 rounded-2xl p-4 text-slate-400">جاري المعالجة السيادية...</div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: message,
                        response_mode: "blocking",
                        user: "Founder-Amr",
                        conversation_id: conversationId
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.answer) {
                    conversationId = data.conversation_id;
                    chatContainer.innerHTML += `
                        <div class="flex items-start space-x-3 space-x-reverse">
                            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">AMI</div>
                            <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-4 max-w-2xl text-slate-200 leading-relaxed shadow-xl">
                                ${escapeHtml(data.answer)}
                            </div>
                        </div>`;
                } else {
                    throw new Error("استجابة غير صالحة من الخادم");
                }
            } catch (error) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-3 space-x-reverse">
                        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center font-bold text-white">!</div>
                        <div class="bg-red-950/50 border border-red-800 rounded-2xl p-4 text-red-200">
                            حدث خطأ في الاتصال بالخادم السيادي. تأكد من اتصال الإنترنت وصلاحية المفتاح.
                        </div>
                    </div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
