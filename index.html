<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI AI | Corely AI Sovereign Intelligence v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .glow-effect { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); }
        .cyber-border { border: 1px solid rgba(59, 130, 246, 0.3); }
        .bg-grid { background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px); background-size: 24px 24px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 3px; }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col justify-between">

    <!-- شاشة تسجيل الدخول السيادية -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-gray-900 cyber-border p-8 rounded-2xl w-full max-w-md glow-effect">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-black text-blue-500 tracking-wider">CORELY AI</h1>
                <p class="text-xs text-gray-400 mt-1">بوابة الدخول إلى النظام السيادي الفائق v3.0</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">اسم المستخدم السيادي</label>
                    <input type="text" id="username-input" required class="w-full bg-gray-950 cyber-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="أدخل اسمك...">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">مفتاح المصادقة السيادي</label>
                    <input type="password" value="app-sECdyceP1zizS7oBvmPOtzhl" disabled class="w-full bg-gray-950 cyber-border rounded-lg px-4 py-3 text-gray-500 text-xs focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition glow-effect mt-2">
                    تفعيل الجلسة العظمى
                </button>
            </form>
        </div>
    </div>

    <!-- الهيدر السيادي -->
    <header class="bg-gray-950/90 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></div>
            <span class="font-black text-lg text-blue-400 tracking-wider">Corely AI</span>
            <span class="text-xs bg-blue-950 text-blue-300 px-2.5 py-0.5 rounded-full border border-blue-800">AMI AI v3.0 Ultra</span>
        </div>
        <div class="flex items-center space-x-3 space-x-reverse">
            <button onclick="clearHistory()" class="text-xs bg-red-950/50 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg border border-red-800 transition">مسح الذاكرة</button>
            <div id="user-badge" class="text-xs text-gray-300 bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-800">غير مسجل</div>
        </div>
    </header>

    <!-- منطقة المحادثة الأسطورية -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between">
        <div id="chat-container" class="space-y-4 overflow-y-auto max-h-[62vh] p-4">
            <div class="flex items-start space-x-3 space-x-reverse">
                <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                    أهلاً بك يا فنان في النظام السيادي الخارق v3.0. تم ترقية البنية التحتية بالكامل، كيف أخدم إمبراطوريتك اليوم؟
                </div>
            </div>
        </div>

        <!-- إدخال الأوامر -->
        <div class="mt-4 bg-gray-900 cyber-border rounded-2xl p-2 flex items-center glow-effect">
            <input type="text" id="user-input" class="flex-1 bg-transparent px-4 py-2 text-white focus:outline-none text-sm" placeholder="أدخل أمرك السيادي الفائق هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold transition text-sm shadow-lg">
                إرسال
            </button>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="text-center py-4 text-xs text-gray-500 border-t border-gray-900">
        Engineered & Commanded by Corely AI • Sovereign Intelligence Architecture
    </footer>

    <script>
        let currentUserId = "amr-sovereign-user";
        let chatHistory = JSON.parse(localStorage.getItem('ami_chat_history')) || [];

        window.onload = function() {
            renderHistory();
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username-input').value;
            if(username) {
                currentUserId = username;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('user-badge').innerText = `المستخدم: ${username}`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function renderHistory() {
            const container = document.getElementById('chat-container');
            if(chatHistory.length === 0) return;
            
            let html = `
                <div class="flex items-start space-x-3 space-x-reverse">
                    <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                    <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                        أهلاً بك يا فنان في النظام السيادي الخارق v3.0. تم ترقية البنية التحتية بالكامل، كيف أخدم إمبراطوريتك اليوم؟
                    </div>
                </div>
            `;
            
            chatHistory.forEach(msg => {
                if(msg.role === 'user') {
                    html += `
                        <div class="flex items-start justify-end space-x-3 space-x-reverse">
                            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-xl text-sm text-gray-200">${escapeHtml(msg.content)}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex items-start space-x-3 space-x-reverse">
                            <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                            <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200 leading-relaxed">${formatResponse(msg.content)}</div>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const userText = input.value.trim();
            if(!userText) return;

            chatHistory.push({ role: 'user', content: userText });
            localStorage.setItem('ami_chat_history', JSON.stringify(chatHistory));

            container.innerHTML += `
                <div class="flex items-start justify-end space-x-3 space-x-reverse">
                    <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-xl text-sm text-gray-200">
                        ${escapeHtml(userText)}
                    </div>
                </div>
            `;
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3 space-x-reverse">
                    <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                    <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-400 animate-pulse">
                        جاري معالجة الأمر الفائق عبر محرك Dify السيادي...
                    </div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('https://api.dify.ai/v1/chat-messages', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer app-sECdyceP1zizS7oBvmPOtzhl',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: userText,
                        response_mode: "blocking",
                        user: currentUserId
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                const aiReply = data.answer || "عذراً، استجابة غير متوقعة من النواة السيادية.";

                chatHistory.push({ role: 'assistant', content: aiReply });
                localStorage.setItem('ami_chat_history', JSON.stringify(chatHistory));

                container.innerHTML += `
                    <div class="flex items-start space-x-3 space-x-reverse">
                        <div class="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0 glow-effect">AMI</div>
                        <div class="bg-gray-900 cyber-border p-4 rounded-2xl max-w-xl text-sm text-gray-200 leading-relaxed">
                            ${formatResponse(aiReply)}
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `
                    <div class="flex items-start space-x-3 space-x-reverse">
                        <div class="bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-xs shrink-0">ERR</div>
                        <div class="bg-gray-900 border border-red-800 p-4 rounded-2xl max-w-xl text-sm text-red-300">
                            فشل الاتصال بالبنية التحتية السيادية. تحقق من الاتصال.
                        </div>
                    </div>
                `;
            }
            container.scrollTop = container.scrollHeight;
        }

        function clearHistory() {
            if(confirm('هل أنت متأكد من رغبتك في مسح ذاكرة الجلسات؟')) {
                localStorage.removeItem('ami_chat_history');
                chatHistory = [];
                location.reload();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatResponse(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
