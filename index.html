<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة AMI السيادية</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        .chat-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 80vh; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .message.user { background: #3b82f6; color: white; align-self: flex-start; }
        .message.bot { background: #334155; color: #e2e8f0; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 15px; background: #0f172a; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; outline: none; font-size: 16px; }
        button { background: #3b82f6; color: white; border: none; padding: 0 20px; border-radius: 6px; margin-right: 10px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <h2>منصة AMI السيادية الذكية</h2>
    <div class="chat-container">
        <div id="chatMessages" class="chat-messages">
            <div class="message bot">أهلاً بك! أنا مساعدك الذكي، كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        <div class="chat-input-area">
            <button onclick="sendMessage()">إرسال</button>
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        </div>
    </div>

    <script>
        // رابط السيرفر الوسيط السحابي الخاص بك على Railway
        const BACKEND_URL = "https://ami-sovereign-backend-production.up.railway.app/api/sovereign-chat";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById('chatMessages');

            // عرض رسالة المستخدم في الواجهة
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // رسالة انتظار رد البوت
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'message bot';
            botMsgDiv.textContent = 'جاري التفكير...';
            chatMessages.appendChild(botMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // إرسال الطلب للسيرفر الوسيط (الذي يخفي مفتاح Dify تماماً)
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: messageText })
                });

                const data = await response.json();

                if (response.ok) {
                    // استخراج الرد من استجابة Dify عبر السيرفر
                    botMsgDiv.textContent = data.answer || data.result || JSON.stringify(data);
                } else {
                    botMsgDiv.textContent = 'حدث خطأ في الاتصال بالسيرفر الوسيط.';
                }
            } catch (error) {
                console.error(error);
                botMsgDiv.textContent = 'تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت.';
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
